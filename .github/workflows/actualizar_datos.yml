name: Sincronización Diaria de Datos Radar FRPD

on:
  schedule:
    # Corre todos los días a las 09:00 UTC (06:00 AM hora de Chile)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite ejecutar manualmente con un clic en GitHub Actions
  push:
    branches:
      - main
    paths:
      - 'fuente/**'
      - 'actualizar_datos.py'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Actualizar datos de Cartera y Compras Públicas
        run: |
          python actualizar_datos.py
          python fuente/build.py

      - name: Confirmar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_radar.json dist/ index.html "Radar FRPD Araucanía.html"
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(datos): actualización automática de datos [skip ci]" && git push)
