name: Sincronización Diaria de Datos Radar FRPD

# Actualización diaria APAGADA el 11-nov-2026: el tablero ya no usa compras públicas ni datos_*.json.
# Queda solo la ejecución manual. El ticket de ChileCompra se lee del secreto del repositorio, nunca de este archivo.
on:
  workflow_dispatch:
    inputs:
      dias_atras:
        description: 'Días hacia atrás a consultar en ChileCompra'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Actualizar datos de Cartera y Compras Públicas
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          DIAS_ATRAS: ${{ github.event.inputs.dias_atras || '1' }}
        run: |
          python actualizar_datos.py

      - name: Confirmar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_radar.json datos_resumen.json dist/ index.html "Radar FRPD Araucanía.html"
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(datos): actualización automática de compras públicas [skip ci]" && git push)
